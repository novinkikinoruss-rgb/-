name: Respectlogistic checks
on:
  push:
    branches: ['respectlogistic/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preview screenshot for visual review
        if: success()
        run: node -e "const fs=require('node:fs');console.log('RESPECT_SCREENSHOT='+fs.readFileSync('test-results/customer-desktop.png').toString('base64'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: respectlogistic-design-and-tests
          path: test-results/
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: respectlogistic_test
          POSTGRES_DB: respectlogistic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d respectlogistic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: respectlogistic_test
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: respectlogistic_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/database-fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f database/customers.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/database.integration.sql
      - name: Dispatch shifts integration
        run: |
          createdb respectlogistic_dispatch_test
          psql -d respectlogistic_dispatch_test -v ON_ERROR_STOP=1 -f tests/dispatch-bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -d respectlogistic_dispatch_test -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -d respectlogistic_dispatch_test -v ON_ERROR_STOP=1 -f tests/dispatch.integration.sql
          psql -d respectlogistic_dispatch_test -v ON_ERROR_STOP=1 -f tests/company-balance.integration.sql
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://yoqejkedmksmvbqagqru.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qnb1bLiXSsB-9VuwFMtCiQ_07nL4hyQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.auth.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authentication-traces
          path: test-results/
