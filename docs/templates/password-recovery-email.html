<h2>Восстановление доступа к CRM</h2>
<p>Введите этот одноразовый код на странице восстановления CRM:</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>После проверки кода создайте новый пароль. Используйте код из последнего письма.</p>
<p>Если вы не запрашивали восстановление, проигнорируйте письмо. Никому не сообщайте код.</p>
